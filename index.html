<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şirxan Restoran</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box;}
body{
margin:0;
font-family:Arial,sans-serif;
color:#222;
transition:.3s;

/* ARXA PLAN ŞƏKİL */
background-image:url("img/background.jpg");
background-size:cover;
background-position:center;
background-attachment:fixed;
}

/* light mode */
body.light{
background-image:url("img/background.jpg");
color:#222;
}

/* dark mode */
body.dark{
background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
url("img/background.jpg");
background-size:cover;
background-position:center;
background-attachment:fixed;
color:#fff;
}
body.light{background:#f4fbff;color:#222;}
body.dark{background:linear-gradient(135deg,#0a1a3b,#13264f,#1b3270,#1b3270);color:#fff;}

.header{
background:linear-gradient(90deg,#111,#1c1c1c,#2a2a2a);
height:120px;
border-bottom-left-radius:60% 35px;
border-bottom-right-radius:70% 35px;
position:relative;
}

/* THEME */
.theme-toggle{
position:absolute;
top:14px;left:14px;
width:40px;height:40px;
border-radius:50%;
background:rgba(255,255,255,.25);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}
.theme-toggle i{color:#fff;position:absolute;}
#moonIcon{display:none;}
body.dark #moonIcon{display:block;}
body.light #sunIcon{display:block;}

/* LOGO */
.logo{
width:100px;height:100px;
background:#fff;
border-radius:50%;
position:absolute;
left:50%;top:45px;
transform:translateX(-50%);
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}
.logo img{
width:150px;
height:150px;
object-fit:contain;
}

/* LANG */
.lang-btn{
position:absolute;
top:14px;
right:14px;
width:40px;
height:40px;
border-radius:50%;
overflow:hidden;
cursor:pointer;
border:2px solid #fff;
}
.lang-btn img{width:100%;height:100%;object-fit:cover;}

.lang-menu{
display:none;
position:absolute;
top:60px;
right:14px;
background:#1a1a1a;
border-radius:12px;
width:150px;
z-index:999;
overflow:hidden;
}
.lang-menu div{
padding:12px;
color:#fff;
cursor:pointer;
}
.lang-menu div:hover{background:#333;}

/* CONTENT */
.content{text-align:center;padding:15px;}
h1{font-size:22px;margin:10px 0;}

/* MENU */
.menu-card{
background:#2fa4aa;
color:#fff;
max-width:360px;
margin:20px auto;
padding:18px;
border-radius:12px;
display:flex;
justify-content:space-between;
cursor:pointer;
}

/* RATING */
.star{font-size:40px;color:#ffc107;cursor:pointer;}
.review-box{display:none;max-width:360px;margin:10px auto;background:#fff;color:#000;padding:15px;border-radius:10px;}
.review-box.show{display:block;}

/* HOURS */
.opening-hours{max-width:360px;margin:15px auto;padding:15px;background:rgba(47,164,170,0.1);border-radius:12px;}

/* KIDS */
.kids-info{max-width:360px;margin:25px auto;padding:20px;background:rgba(255,245,200,0.4);border-radius:15px;}

/* FOOTER */
.footer{text-align:center;margin-top:10px;}
.social-buttons{display:flex;justify-content:center;gap:20px;}
.social-btn{font-size:28px;color:#2fa4aa;}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

<div class="theme-toggle" id="themeToggle">
<i class="fas fa-moon" id="moonIcon"></i>
<i class="fas fa-sun" id="sunIcon"></i>
</div>

<!-- BAYRAQ -->
<div class="lang-btn" id="langBtn">
<img id="langFlag" src="ımg/azerbaycan-bayragi.webp">
</div>

<!-- LANG MENU -->
<div class="lang-menu" id="langMenu">
<div data-lang="az">Azərbaycan</div>
<div data-lang="ru">Русский</div>
<div data-lang="en">English</div>
</div>

</div>

<!-- LOGO -->
<div class="logo">
<img src="img/Gemini_Generated_Image_6r6l4e6r6l4e6r6l.png
">
</div>

<!-- CONTENT -->
<div class="content">

<h1 id="title">Şirxan Restoran</h1>

<div id="stars"></div>

<div id="ratingText">Ortalama: 4.8 ⭐ (Rəy sayı: 280)</div>

<div class="review-box" id="reviewBox">
<form id="reviewForm">
<input id="nameInput" placeholder="Adınız" required>
<textarea id="commentInput" placeholder="Rəy yazın" required></textarea>
<input type="hidden" id="ulduzInput">
<button>Göndər</button>
</form>
</div>

<div class="menu-card" id="menuText" onclick="window.location.href='index(1).html'">
📖 Menyuya baxın
</div>
 <!-- INSTAGRAM -->
    <div class="menu-card social-card instagram"
         onclick="window.open('','_blank')">
        <span><i class="fab fa-instagram"></i> Instagram</span><span>›</span>
    </div>

    <!-- TIKTOK -->
    <div class="menu-card social-card tiktok"
         onclick="window.open('','_blank')">
        <span><i class="fab fa-tiktok"></i> TikTok</span><span>›</span>
    </div>

<div class="opening-hours">
<strong id="hoursTitle">Açılış Saatları</strong><br>
<span id="hoursText">07:00 - 12:00</span>
</div>

<div class="kids-info">
<h3 id="infoTitle">Şirxan Restoran</h3>
<p id="infoDesc">m</p>
<ul id="infoList"></ul>
</div>

<div class="footer">
<div id="footerText">Məkan - Şəmkir</div>
</div>

</div>

<script>

/* THEME */
const toggle=document.getElementById("themeToggle");
toggle.onclick=()=>{
document.body.classList.toggle("dark");
document.body.classList.toggle("light");
};

/* LANG */
const langBtn=document.getElementById("langBtn");
const langMenu=document.getElementById("langMenu");

langBtn.onclick=()=>langMenu.style.display=
langMenu.style.display==="block"?"none":"block";

document.addEventListener("click",(e)=>{
if(!langBtn.contains(e.target)&&!langMenu.contains(e.target)){
langMenu.style.display="none";
}});

/* FLAGS */
const flags={
az:"img/azerbaijan-flag.jpg",
ru:"img/russia-flag.jpg",
en:"img/360_F_62198244_HcI4q6pS86tREeUYuseBfTzPP7nLaSPi.jpg"
};

/* TEXTS */
const texts={
az:{
title:"Şirxan Restoran",
menu:"📖 Menyuya baxın",
hours:"Açılış Saatları",
hoursText:"07:00 - 12:00",
desc:"🌿 Şirxan Ailəvi Restoranı — Təbiətin qoynunda rahatlıq və əyləncə bir arada!🏡 Rahat və modern A-frame evlərdə ,kotteclerde ve otelin otaqlarında istirahət edin,🍽️ Dadlı milli və müxtəlif mətbəx təamlarından zövq alın,👨‍👩‍👧‍👦 Ailənizlə unudulmaz vaxt keçirin.🎠 Uşaqlar üçün geniş həyət, oyuncaqlar və əyləncə zonası ilə balacalar da günün dadını çıxarsın!✨ Həm istirahət, həm əyləncə, həm də ailə üçün ideal məkan — Şirxan Ailəvi Restoranı.",
footer:"Məkan - Şəmkir"
},
ru:{
title:"Ресторан Ширхан",
menu:"📖 Меню",
hours:"Часы работы",
hoursText:"07:00 - 12:00",
desc:"Вкусная еда и атмосфера",
footer:"Локация - Шамкир",
list:["Кебаб","Открытый воздух","Семья","Тишина","Шамкир"]
},
en:{
title:"Shirxan Restaurant",
menu:"📖 Menu",
hours:"Opening Hours",
hoursText:"07:00 - 12:00",
desc:"🌿 Shirxan Family Restaurant — Relaxation and fun together in the heart of nature! 🏡 Relax in our comfortable and modern A-frame houses, cottages, and hotel rooms, 🍽️ Enjoy delicious traditional and international cuisine, 👨‍👩‍👦 Spend unforgettable time with your family. 🎠 Let the little ones enjoy their day too with a spacious yard, toys, and a play area! ✨ The perfect place for relaxation, fun, and family — Shirxan Family Restaurant.",
footer:"Location - Shamkir"
}
};

/* SET LANGUAGE */
function setLang(l){

const t=texts[l];

document.getElementById("title").innerText=t.title;
document.getElementById("menuText").innerText=t.menu;
document.getElementById("hoursTitle").innerText=t.hours;
document.getElementById("hoursText").innerText=t.hoursText;
document.getElementById("infoDesc").innerText=t.desc;
document.getElementById("footerText").innerText=t.footer;

/* list */
const ul=document.getElementById("infoList");
ul.innerHTML="";
t.list.forEach(i=>{
let li=document.createElement("li");
li.innerText=i;
ul.appendChild(li);
});

/* FLAG CHANGE */
document.getElementById("langFlag").src=flags[l];

localStorage.setItem("lang",l);
langMenu.style.display="none";
}

/* LOAD SAVED */
setLang(localStorage.getItem("lang")||"az");

/* CLICK LANG */
document.querySelectorAll("#langMenu div").forEach(i=>{
i.onclick=()=>setLang(i.dataset.lang);
});

/* STARS */
const starBox=document.getElementById("stars");
for(let i=1;i<=5;i++){
let s=document.createElement("span");
s.innerHTML="★";
s.className="star";
s.onclick=()=>alert("Rating: "+i);
starBox.appendChild(s);
}

</script>

</body>
</html>
